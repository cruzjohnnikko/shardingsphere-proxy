mode:
  type: Standalone
  repository:
    type: File
    props:
      path: ./data

authority:
  users:
    - user: root@%
      password: root
  privilege:
    type: ALL_PERMITTED

props:
  proxy-frontend-database-protocol-type: PostgreSQL
  sql-show: true
  proxy-default-port: 3308
  cdc-server-port: 33071