version: '3.8'

services:
  # Primary PostgreSQL (Write Database)
  postgres_write:
    image: postgres:15
    container_name: postgres_write
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_write_data:/var/lib/postgresql/data
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    networks:
      - cdc_network

  # Read Replica PostgreSQL (Read Database)
  postgres_read:
    image: postgres:15
    container_name: postgres_read
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_read_data:/var/lib/postgresql/data
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    networks:
      - cdc_network
    depends_on:
      - postgres_write

  # Target Database for CDC (separate from read-write)
  postgres_target:
    image: postgres:15
    container_name: postgres_target
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: target_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_target_data:/var/lib/postgresql/data
    networks:
      - cdc_network

  # Source Database for Migration (simulates existing production DB)
  postgres_source:
    image: postgres:15
    container_name: postgres_source
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: source_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    networks:
      - cdc_network

  # ZooKeeper for ShardingSphere Cluster Mode
  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: "*"
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    networks:
      - cdc_network
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_write_data:
  postgres_read_data:
  postgres_target_data:
  postgres_source_data:
  zookeeper_data:
  zookeeper_datalog:

networks:
  cdc_network:
    driver: bridge
