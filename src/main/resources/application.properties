# Server Configuration
server.port=8080

# CDC Configuration
cdc.server.address=localhost
cdc.server.port=33071
cdc.username=root
cdc.password=root

# Source Database (via ShardingSphere Proxy)
source.datasource.url=jdbc:postgresql://localhost:3308/sharding_db
source.datasource.username=root
source.datasource.password=root

# Target Database (Direct PostgreSQL - separate database for CDC demo)
target.datasource.url=jdbc:postgresql://localhost:5432/target_db
target.datasource.username=postgres
target.datasource.password=postgres

# Write Database Configuration (for read-write splitting)
write.datasource.url=jdbc:postgresql://localhost:5432/postgres
write.datasource.username=postgres
write.datasource.password=postgres

# Read Database Configuration (for read-write splitting)
read.datasource.url=jdbc:postgresql://localhost:5433/postgres
read.datasource.username=postgres
read.datasource.password=postgres

# Migration Database Configuration (Source -> Target)
# Using source_db (port 5435) as demo source, and existing target_db (port 5432) as target
migration.source.url=jdbc:postgresql://localhost:5435/source_db
migration.source.username=postgres
migration.source.password=postgres

migration.target.url=jdbc:postgresql://localhost:5432/target_db
migration.target.username=postgres
migration.target.password=postgres

# Logging
logging.level.root=INFO
logging.level.org.apache.shardingsphere=DEBUG
logging.level.org.apache.shardingsphere.example=DEBUG
logging.level.org.apache.shardingsphere.example.proxy.cdc.service.CDCClientService=DEBUG
