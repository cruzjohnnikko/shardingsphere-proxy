# Server Configuration
server.port=8080

# CDC Server Configuration
cdc.server.host=127.0.0.1
cdc.server.port=33071
cdc.server.timeout=10000

# CDC Database Configuration
cdc.database.name=sharding_db
cdc.table.name=t_order

# CDC Login Configuration
cdc.login.username=root
cdc.login.password=root

# CDC Options
# Set to false to only capture NEW changes (skip historical data with TRUNCATE)
cdc.full.sync=false

# Data Source Configuration (for data generator)
# IMPORTANT: Must write through ShardingSphere Proxy for CDC to capture changes!
datasource.url=jdbc:postgresql://localhost:3308/sharding_db
datasource.username=root
datasource.password=root

# Target Database Configuration (for CDC replication - direct to target postgres)
target.datasource.url=jdbc:postgresql://localhost:5432/postgres
target.datasource.username=postgres
target.datasource.password=root

# Logging
logging.level.org.apache.shardingsphere=INFO
logging.level.org.apache.shardingsphere.example=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

