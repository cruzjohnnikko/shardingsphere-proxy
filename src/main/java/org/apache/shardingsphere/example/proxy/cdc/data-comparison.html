<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDC Data Comparison - Source vs Target</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-label {
            color: #718096;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #2d3748;
            font-size: 32px;
            font-weight: bold;
        }

        .stat-value.source {
            color: #3182ce;
        }

        .stat-value.target {
            color: #38a169;
        }

        .stat-value.unsynced {
            color: #dd6b20;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .data-panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header.source {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .panel-header.target {
            background: linear-gradient(135deg, #38a169 0%, #2f855a 100%);
            color: white;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead {
            background: #f7fafc;
        }

        .data-table th {
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e2e8f0;
        }

        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
            color: #2d3748;
        }

        .data-table tbody tr:hover {
            background: #f7fafc;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.pending {
            background: #fef5e7;
            color: #d68910;
        }

        .status-badge.processing {
            background: #ebf4ff;
            color: #3182ce;
        }

        .status-badge.shipped {
            background: #e3fcef;
            color: #27ae60;
        }

        .status-badge.delivered {
            background: #d5f4e6;
            color: #38a169;
        }

        .status-badge.completed {
            background: #d5f4e6;
            color: #2f855a;
        }

        .status-badge.cancelled {
            background: #ffe5e5;
            color: #e53e3e;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: #a0aec0;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #a0aec0;
        }

        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .action-bar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
        }

        .btn-success {
            background: #38a169;
            color: white;
        }

        .btn-success:hover {
            background: #2f855a;
        }

        .auto-refresh {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auto-refresh label {
            color: #4a5568;
            font-size: 14px;
        }

        .auto-refresh input[type="checkbox"] {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 CDC Data Comparison</h1>
            <p>Real-time comparison of Source Database vs CDC Target</p>
        </div>

        <!-- Statistics Row -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Source Records</div>
                <div class="stat-value source" id="sourceCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Target Records</div>
                <div class="stat-value target" id="targetCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unsynced</div>
                <div class="stat-value unsynced" id="unsyncedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">CDC Job Status</div>
                <div class="stat-value" id="cdcStatus" style="font-size: 20px;">Not Running</div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
            <button class="btn btn-primary" onclick="refreshAll()">🔄 Refresh All</button>
            <button class="btn btn-success" onclick="window.location.href='/'">← Back to Dashboard</button>
            <div class="auto-refresh">
                <label>
                    <input type="checkbox" id="autoRefresh" checked> Auto-refresh (5s)
                </label>
            </div>
        </div>

        <!-- Comparison Grid -->
        <div class="comparison-grid" style="margin-top: 20px;">
            <!-- Source Panel -->
            <div class="data-panel">
                <div class="panel-header source">
                    <div class="panel-title">🗄️ Source Database</div>
                    <button class="refresh-btn" onclick="loadSourceData()">Refresh</button>
                </div>
                <div id="sourceTableContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading source data...
                    </div>
                </div>
            </div>

            <!-- Target Panel -->
            <div class="data-panel">
                <div class="panel-header target">
                    <div class="panel-title">🎯 CDC Target</div>
                    <button class="refresh-btn" onclick="loadTargetData()">Refresh</button>
                </div>
                <div id="targetTableContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading target data...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api/cdc';
        let autoRefreshInterval = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            refreshAll();
            setupAutoRefresh();
        });

        // Setup auto-refresh
        function setupAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            checkbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    autoRefreshInterval = setInterval(refreshAll, 5000);
                } else {
                    if (autoRefreshInterval) {
                        clearInterval(autoRefreshInterval);
                    }
                }
            });

            // Start auto-refresh
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(refreshAll, 5000);
            }
        }

        // Refresh all data
        async function refreshAll() {
            await Promise.all([
                loadStats(),
                loadSourceData(),
                loadTargetData()
            ]);
        }

        // Load statistics
        async function loadStats() {
            try {
                const [statusRes, statsRes, countRes] = await Promise.all([
                    fetch(`${API_BASE}/status`),
                    fetch(`${API_BASE}/statistics`),
                    fetch(`${API_BASE}/recordCount`)
                ]);

                const status = await statusRes.json();
                const stats = await statsRes.json();
                const count = await countRes.json();

                // Update stats
                const sourceCount = count.count || 0;
                const targetCount = (stats.insertCount || 0) - (stats.deleteCount || 0);
                const unsynced = sourceCount - targetCount;

                document.getElementById('sourceCount').textContent = sourceCount.toLocaleString();
                document.getElementById('targetCount').textContent = targetCount.toLocaleString();
                document.getElementById('unsyncedCount').textContent = unsynced.toLocaleString();
                
                // Update CDC status
                const cdcStatusEl = document.getElementById('cdcStatus');
                if (status.streaming) {
                    cdcStatusEl.textContent = '✓ Running';
                    cdcStatusEl.style.color = '#38a169';
                } else {
                    cdcStatusEl.textContent = '✗ Not Running';
                    cdcStatusEl.style.color = '#e53e3e';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load source data
        async function loadSourceData() {
            const container = document.getElementById('sourceTableContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading source data...</div>';

            try {
                // Query through proxy
                const response = await fetch(`${API_BASE}/sourceData?limit=50`);
                if (!response.ok) {
                    throw new Error('Failed to load source data');
                }
                
                const data = await response.json();
                
                if (data.records && data.records.length > 0) {
                    container.innerHTML = renderTable(data.records, 'source');
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div>No records in source database</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading source data:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div>Could not load source data</div>
                        <div style="font-size: 12px; margin-top: 8px;">${error.message}</div>
                    </div>
                `;
            }
        }

        // Load target data (from CDC events)
        async function loadTargetData() {
            const container = document.getElementById('targetTableContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading CDC events...</div>';

            try {
                const response = await fetch(`${API_BASE}/events?limit=50`);
                if (!response.ok) {
                    throw new Error('Failed to load CDC events');
                }
                
                const events = await response.json();
                
                if (events && events.length > 0) {
                    // Convert events to table format
                    const records = events.map(event => ({
                        order_id: event.afterData?.order_id || event.beforeData?.order_id || 'N/A',
                        user_id: event.afterData?.user_id || event.beforeData?.user_id || 'N/A',
                        status: event.afterData?.status || event.beforeData?.status || 'N/A',
                        event_type: event.eventType
                    }));
                    container.innerHTML = renderTable(records, 'target');
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div>No CDC events captured yet</div>
                            <div style="font-size: 12px; margin-top: 8px;">Start streaming to capture changes</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading target data:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div>Could not load CDC events</div>
                        <div style="font-size: 12px; margin-top: 8px;">${error.message}</div>
                    </div>
                `;
            }
        }

        // Render table
        function renderTable(records, type) {
            const headers = type === 'target' 
                ? ['Order ID', 'User ID', 'Status', 'Event Type']
                : ['Order ID', 'User ID', 'Status'];

            let html = '<table class="data-table"><thead><tr>';
            headers.forEach(header => {
                html += `<th>${header}</th>`;
            });
            html += '</tr></thead><tbody>';

            records.forEach(record => {
                html += '<tr>';
                html += `<td><strong>${record.order_id}</strong></td>`;
                html += `<td>${record.user_id}</td>`;
                html += `<td><span class="status-badge ${record.status}">${record.status}</span></td>`;
                if (type === 'target') {
                    const eventColor = record.event_type === 'INSERT' ? '#38a169' : 
                                      record.event_type === 'UPDATE' ? '#3182ce' : '#e53e3e';
                    html += `<td><span style="color: ${eventColor}; font-weight: 600;">${record.event_type}</span></td>`;
                }
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }
    </script>
</body>
</html>
